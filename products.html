<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — Inhashee</title>
    <meta
      name="description"
      content="Shop Inhashee hair treatments and home care — smoothing treatments, shampoo, conditioner and masks."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="header"></div>

    <section class="page-hero">
      <div class="container">
        <span class="breadcrumb"><a href="index.html">Home</a> / Products</span>
        <h1>Full Range of Products</h1>
        <p>
          Treatments for visible change, home care to keep it going. Filter by
          category below.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <button class="filter-chip active" data-filter="all">
            All Products
          </button>
          <button class="filter-chip" data-filter="treatments">
            Treatments
          </button>
          <button class="filter-chip" data-filter="conditioner">
            Conditioner
          </button>
          <button class="filter-chip" data-filter="sampu">Sampu</button>
          <button class="filter-chip" data-filter="other">Other</button>
        </div>

        <div class="product-grid" id="productGrid">
          <div class="loader-wrapper">
            <div class="loader"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="newsletter">
      <div class="container">
        <span class="eyebrow on-light">Stay in the loop</span>
        <h3>Get early access to new launches</h3>
        <p>
          One email, occasionally — new products, restocks and hair-care tips.
        </p>
        <form class="newsletter-form">
          <input
            type="email"
            placeholder="you@email.com"
            aria-label="Email address"
          />
          <button type="submit">Subscribe</button>
        </form>
        <div class="form-note"></div>
      </div>
    </section>

    <div id="footer"></div>

    <script src="assets/js/inc.js?v=asdasdsadv2323432"></script>

    <script src="assets/js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function (e) {
        try {
          const res = await fetch(
            "https://morning-dream-6de5.bhuniajayant.workers.dev/api-get-products",
          );

          if (!res.ok) {
            console.log(res);
            throw new Error(res.statusText);
          }

          const products = await res.json();

          console.log(products);
          let div = "";
          if (products?.data?.length) {
            products.data.forEach((product) => {
              div += `<div class="product-card" data-category="${product?.productType}">
              <div class="product-media">
                <img src="${product?.imagedata}" />
              </div>
              <div class="product-body">
                <span class="product-cat">${product?.productType}</span>
                <h3 class="product-name">${product?.productName}</h3>
                <div class="product-price">
                  ${product?.oldAmount ? '<span class="strike">₹' + product?.oldAmount + "</span>₹" + product?.amount : "₹" + product?.amount}
                </div>
                <a href="product.html?id=${product.id}" class="product-cta">Details</a>
              </div>
            </div>`;
            });
          } else {
            div = "<p>No Product Available</p>";
          }
          productGrid.innerHTML = div;
        } catch (error) {
          alert(error.message);
        }

        /* ---------- product filter chips (products.html) ---------- */
        var chips = document.querySelectorAll(".filter-chip");
        var cards = document.querySelectorAll("[data-category]");
        if (chips.length && cards.length) {
          chips.forEach(function (chip) {
            chip.addEventListener("click", function () {
              chips.forEach(function (c) {
                c.classList.remove("active");
              });
              chip.classList.add("active");
              var target = chip.getAttribute("data-filter");
              cards.forEach(function (card) {
                var match =
                  target === "all" ||
                  card.getAttribute("data-category") === target;
                card.style.display = match ? "" : "none";
              });
            });
          });
        }
      });
    </script>
  </body>
</html>
