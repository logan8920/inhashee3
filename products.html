  <body>
    <div id="header"></div>

    <section class="page-hero">
      <div class="container">
        <span class="breadcrumb"><a href="index.html">Home</a> / Products</span>

    <section class="section">
      <div class="container">
        <div class="shop-toolbar">
          <div class="view-switcher">
            <button class="view-btn" data-cols="2" aria-label="View 2 per row">
              <svg viewBox="0 0 20 20">
                <rect x="1" y="1" width="8" height="8" />

                <rect x="1" y="11" width="8" height="8" />
                <rect x="11" y="11" width="8" height="8" />
              </svg>
            </button>
            <button
              class="view-btn active"
              data-cols="4"
              aria-label="View 4 per row"
            >
              <svg viewBox="0 0 20 20">
                <rect x="1" y="1" width="3.6" height="3.6" />
                <rect x="6" y="1" width="3.6" height="3.6" />
                <rect x="11" y="1" width="3.6" height="3.6" />
                <rect x="16" y="1" width="3" height="3.6" />
                <rect x="1" y="6" width="3.6" height="3.6" />
                <rect x="6" y="6" width="3.6" height="3.6" />
                <rect x="11" y="6" width="3.6" height="3.6" />
                <rect x="16" y="6" width="3" height="3.6" />
                <rect x="1" y="11" width="3.6" height="3.6" />
                <rect x="6" y="11" width="3.6" height="3.6" />
                <rect x="11" y="11" width="3.6" height="3.6" />
                <rect x="16" y="11" width="3" height="3.6" />
              </svg>
            </button>
            <button class="view-btn" data-cols="list" aria-label="List view">
              <svg viewBox="0 0 20 20">
                <rect x="1" y="2" width="18" height="3" />
                <rect x="1" y="9" width="18" height="3" />
                <rect x="1" y="16" width="18" height="2" />
              </svg>
            </button>
          </div>

          <div class="toolbar-count">
            <span id="resultsCount">0</span> Products
          </div>

          <div class="toolbar-right">
            <select
              id="sortSelect"
              class="sort-select"
              aria-label="Sort products"
            >
              <option value="default">Sort By</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name-asc">Name: A–Z</option>
            </select>
            <button class="filter-toggle-btn" id="filterToggleBtn">
              Filter
              <svg viewBox="0 0 20 20"><path d="M2 4h16M5 10h10M8 16h4" /></svg>
            </button>
          </div>
        </div>

        <div class="filter-bar" id="filterBar">
          <button class="filter-chip active" data-filter="all">
            All Products
          </button>
          <button class="filter-chip" data-filter="treatments">
            Treatments
          </button>
          <button class="filter-chip" data-filter="conditioner">
            Conditioner
          </button>
          <button class="filter-chip" data-filter="shampoo">Shampoo</button>
          <button class="filter-chip" data-filter="other">Other</button>
        </div>

        <div class="product-grid" id="productGrid">

          </div>

    <section class="newsletter">
      <div class="container">
        <span class="eyebrow on-light">Stay in the loop</span>

          One email, occasionally — new products, restocks and hair-care tips.
        </p>
        <form class="newsletter-form">
          <input
            type="email"
            placeholder="you@email.com"
            aria-label="Email address"
          />
          <button type="submit">Subscribe</button>
        </form>
        <div class="form-note"></div>
      </div>
    </section>

    <div id="footer"></div>

    <script src="assets/js/inc.js?v=asdasdsadv23"></script>

    <script src="assets/js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function (e) {
        try {
          const res = await fetch(
            "https://morning-dream-6de5.bhuniajayant.workers.dev/api-get-products",
          );

          if (!res.ok) {
            console.log(res);
            throw new Error(res.statusText);
          }

          const products = await res.json();

          console.log(products);
          let div = "";
          if (products?.data?.length) {
            products.data.forEach((product) => {
              div += `<div class="product-card" data-category="${product?.productType}" data-price="${product?.amount}" data-name="${product?.productName}">
              <div class="product-media">
                <img src="${product?.imagedata}" />
              </div>
              <div class="product-body">
                <span class="product-cat">${product?.productType}</span>
                <h3 class="product-name">${product?.productName}</h3>
                <div class="product-price">
                  ${product?.oldAmount ? '<span class="strike">₹' + product?.oldAmount + "</span>₹" + product?.amount : "₹" + product?.amount}
                </div>
                <a href="product.html?id=${product.id}" class="product-cta">Details</a>
              </div>
            </div>`;
            });
          } else {
            div = "<p>No Product Available</p>";
          }

          productGrid.innerHTML = div;
          /* ---------- product filter chips (products.html) ---------- */
          var chips = document.querySelectorAll(".filter-chip");
          var cards = document.querySelectorAll("[data-category]");
          var resultsCount = document.getElementById("resultsCount");
          function updateCount() {
            if (!resultsCount) return;
            var visible = 0;
            cards.forEach(function (card) {
              if (card.style.display !== "none") visible++;
            });
            resultsCount.textContent = visible;
          }
          if (chips.length && cards.length) {
            chips.forEach(function (chip) {
              chip.addEventListener("click", function () {
                chips.forEach(function (c) {
                  c.classList.remove("active");
                });
                chip.classList.add("active");
                var target = chip.getAttribute("data-filter");
                cards.forEach(function (card) {
                  var match =
                    target === "all" ||
                    card.getAttribute("data-category") === target;
                  card.style.display = match ? "" : "none";
                });
                updateCount();
              });
            });
            updateCount();
          }
          /* ---------- shop toolbar: view switcher ---------- */
          var viewBtns = document.querySelectorAll(".view-btn");
          //var productGrid = document.getElementById("productGrid");
          if (viewBtns.length && productGrid) {
            viewBtns.forEach(function (btn) {
              btn.addEventListener("click", function () {
                viewBtns.forEach(function (b) {
                  b.classList.remove("active");
                });
                btn.classList.add("active");
                productGrid.classList.remove("cols-2", "cols-list");
                var cols = btn.getAttribute("data-cols");
                if (cols === "2") productGrid.classList.add("cols-2");
                if (cols === "list") productGrid.classList.add("cols-list");
              });
            });
          }
          /* ---------- shop toolbar: filter toggle ---------- */
          var filterToggleBtn = document.getElementById("filterToggleBtn");
          var filterBar = document.getElementById("filterBar");
          if (filterToggleBtn && filterBar) {
            filterToggleBtn.addEventListener("click", function () {
              filterBar.classList.toggle("open");
              filterToggleBtn.classList.toggle("active");
            });
          }
          /* ---------- shop toolbar: sort ---------- */
          var sortSelect = document.getElementById("sortSelect");
          if (sortSelect && productGrid) {
            sortSelect.addEventListener("change", function () {
              var val = sortSelect.value;
              var cardList = Array.prototype.slice.call(
                productGrid.querySelectorAll(".product-card"),
              );
              cardList.sort(function (a, b) {
                if (val === "price-asc")
                  return a.dataset.price - b.dataset.price;
                if (val === "price-desc")
                  return b.dataset.price - a.dataset.price;
                if (val === "name-asc")
                  return a.dataset.name.localeCompare(b.dataset.name);
                return 0;
              });
              if (val !== "default") {
                cardList.forEach(function (card) {
                  productGrid.appendChild(card);
                });
              }
            });
          }
        } catch (error) {
          alert(error.message);
        }

        /* ---------- product filter chips (products.html) ---------- */
        var chips = document.querySelectorAll(".filter-chip");
        var cards = document.querySelectorAll("[data-category]");
        if (chips.length && cards.length) {
          chips.forEach(function (chip) {
            chip.addEventListener("click", function () {
              chips.forEach(function (c) {
                c.classList.remove("active");
              });
              chip.classList.add("active");
              var target = chip.getAttribute("data-filter");
              cards.forEach(function (card) {
                var match =
                  target === "all" ||
                  card.getAttribute("data-category") === target;
                card.style.display = match ? "" : "none";
              });
            });
          });
        }
      });
    </script>
  </body>
