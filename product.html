<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — Inhashee</title>
    <meta
      name="description"
      content="Shop Inhashee hair treatments and home care — smoothing treatments, shampoo, conditioner and masks."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="header"></div>

    <section class="page-hero">
      <div class="container">
        <span class="breadcrumb"><a href="index.html">Home</a> / Products</span>
        <h1>Product Details</h1>
        <p id="breadName"></p>
      </div>
    </section>

    <section class="section tight p-box-1">
      <div class="container pdp-grid">
        <!-- gallery -->
        <div class="pdp-gallery">
          <div class="pdp-main-image">
            <img id="mainProductImage" src="" alt="" />
          </div>
        </div>

        <!-- info -->
        <div class="pdp-info">
          <span id="pType" class="product-cat"></span>
          <h1 id="pName" class="pdp-title mainp"></h1>

          <!-- <div class="pdp-rating">
            <span class="stars" aria-label="4.5 out of 5 stars">★★★★☆</span>
            <span class="rating-count">128 reviews</span>
          </div> -->

          <div class="pdp-price">
            <span id="cPrice" class="strike mainp"></span>
            <span id="mPrice" class="price-now mainp"></span>
            <!-- <span class="save-badge">Save 25%</span> -->
          </div>

          <!-- <p class="pdp-desc">
            A treatment-grade smoothing serum built to reduce frizz and add
            lasting shine, without weighing hair down. Formulated for
            professional use and safe on color-treated hair.
          </p> -->

          <div id="Specification" class="pdp-options"></div>

          <ul id="features" class="pdp-highlights"></ul>
        </div>
      </div>
    </section>

    <!-- ============ TABS: DESCRIPTION / INGREDIENTS / HOW TO USE ============ -->
    <section class="section tight p-box-2">
      <div class="container">
        <div class="pdp-tabs">
          <button class="pdp-tab active" data-tab="desc">Description</button>
          <!-- <button class="pdp-tab" data-tab="ingredients">Ingredients</button>
          <button class="pdp-tab" data-tab="usage">How to Use</button> -->
        </div>

        <div class="pdp-tab-panel active" id="desciption"></div>
      </div>
    </section>

    <svg
      class="strand dim"
      viewBox="0 0 1200 40"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path d="M0,20 C150,0 250,40 400,20 S650,0 800,20 S1050,40 1200,20" />
    </svg>

    <!-- ============ RELATED PRODUCTS ============ -->
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow on-light">You may also like</span>
            <h2>Complete the routine</h2>
          </div>
          <a href="products.html" class="view-all">View all products →</a>
        </div>

        <div class="product-grid" id="productGrid">
          <div class="loader-wrapper">
            <div class="loader"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="newsletter">
      <div class="container">
        <span class="eyebrow on-light">Stay in the loop</span>
        <h3>Get early access to new launches</h3>
        <p>
          One email, occasionally — new products, restocks and hair-care tips.
        </p>
        <form class="newsletter-form">
          <input
            type="email"
            placeholder="you@email.com"
            aria-label="Email address"
          />
          <button type="submit">Subscribe</button>
        </form>
        <div class="form-note"></div>
      </div>
    </section>

    <div id="footer"></div>

    <script src="assets/js/inc.js?v=asdasdsadv23"></script>

    <script src="assets/js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function (e) {
        try {
          const url = new URL(window.location);
          const id = url.searchParams.get("id");
          const res = await fetch(
            `https://morning-dream-6de5.bhuniajayant.workers.dev/api-get-products?id=${id}`,
          );

          if (!res.ok) {
            console.log(res);
            throw new Error(res.statusText);
          }

          const products = await res.json();

          console.log(products);
          let div = "";
          if (products?.data?.length) {
            let product = products.data[0];
            g("title").textContent = `Inhashee - ${product.productName}`;
            mainProductImage.src = product.imagedata;
            mainProductImage.alt = product.productName;
            pType.textContent = product.productType;
            breadName.textContent = product.productName;
            pName.textContent = product.productName;
            mPrice.textContent = product.amount;
            cPrice.textContent = product.oldAmount;
            features.textContent = product.features;
            desciption.textContent = product.description;
            specification.textContent = product.specification;
          } else {
            g(".p-box-1").innerHTML = "<p>No Product Available</p>";
            g(".p-box-2").innerHTML = "<p>No Product Available</p>";
          }
          productGrid.innerHTML = div;
        } catch (error) {
          alert(error.message);
        }

        try {
          const res = await fetch(
            "https://morning-dream-6de5.bhuniajayant.workers.dev/api-get-products?limit=4",
          );

          if (!res.ok) {
            console.log(res);
            throw new Error(res.statusText);
          }

          const products = await res.json();

          console.log(products);

          let div = "";
          if (products?.data?.length) {
            products.data.splice(0, 4).forEach((product) => {
              div += `<div class="product-card">
            <a href="product.html?id=${product.id}"
              ><div class="product-media">
                <img src="${product.imagedata}" alt="${product.productName}" /></div
            ></a>
            <div class="product-body">
              <span class="product-cat">${product.productType}</span>
              <h3 class="product-name">${product.productName}</h3>
              <div class="product-price">₹${product.amount}</div>
              <a class="product-cta" href="product.html?id=${product.id}">View Details</a>
            </div>
          </div>`;
            });
          } else {
            div = "<p>No Product Available</p>";
          }
          productGrid.innerHTML = div;
        } catch (error) {
          alert(error.message);
        }
      });

      function g(selector) {
        return document.querySelector(selector);
      }
    </script>
  </body>
</html>
