  <body>
    <div id="header"></div>

    <section class="page-hero">
      <div class="container">
        <span class="breadcrumb"
          ><a href="index.html">Home</a> / Contact Us</span
        >
        <h1>We'd love to hear from you</h1>
        <p>
          Order questions, product advice, or wholesale enquiries — send us a
          message and we'll get back to you.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="split-media">
          <img src="assets/images/bottle-image.png" style="max-width: 70%;" alt="Inhashee Image">
        </div>

        <div>
          <form class="contact-form" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="name">Full name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  data-required
                  placeholder="Your name"
                />
                <span class="err-msg">Please enter your name.</span>
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  data-required
                  placeholder="you@email.com"
                />
                <span class="err-msg">Please enter a valid email.</span>
              </div>
              <div class="field">
                <label for="phone">Phone</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  data-required
                  placeholder="+91 00000 00000"
                />
                <span class="err-msg">Please enter a valid phone number.</span>
              </div>
              <div class="field">
                <label for="topic">Topic</label>
                <select id="topic" name="topic" data-required>
                  <option value="">Select one</option>
                  <option value="order">Order query</option>
                  <option value="product">Product advice</option>
                  <option value="wholesale">
                    Wholesale / salon partnership
                  </option>
                  <option value="other">Something else</option>
                </select>
                <span class="err-msg">Please choose a topic.</span>
              </div>
              <div class="field full">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="5"
                  data-required
                  placeholder="How can we help?"
                ></textarea>
                <span class="err-msg">Please enter a message.</span>
              </div>
            </div>
            <button type="submit" class="btn btn-solid">Send Message</button>
            <div class="form-status"></div>
          </form>
        </div>
      </div>
